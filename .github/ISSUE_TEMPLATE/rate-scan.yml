name: Request a free rate scan
description: Ask UnitRate Watch to compare your current self-storage rate with public nearby pricing.
title: "Rate scan: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing UnitRate Watch. Please do not include your name, email, account number, gate code, payment information, or anything else private. Facility/location, unit details, and pricing are enough.
  - type: input
    id: location
    attributes:
      label: Current facility or ZIP
      description: Facility name/address or ZIP code. Do not include your unit number.
      placeholder: "Example: Public Storage, 77058"
    validations:
      required: true
  - type: input
    id: current_rent
    attributes:
      label: Current monthly base rent
      placeholder: "$220"
    validations:
      required: true
  - type: input
    id: previous_rent
    attributes:
      label: Previous monthly rent, if this followed an increase
      placeholder: "$149"
    validations:
      required: false
  - type: input
    id: unit_size
    attributes:
      label: Unit size
      placeholder: "10x10"
    validations:
      required: true
  - type: dropdown
    id: unit_type
    attributes:
      label: Unit type
      options:
        - Climate controlled
        - Drive-up / non-climate
        - Indoor / non-climate
        - Vehicle / RV / boat
        - Other / not sure
    validations:
      required: true
  - type: input
    id: advertised_rate
    attributes:
      label: Current advertised rate at your facility, if you checked
      description: Optional. This helps us test whether existing renters are paying materially more than new-customer pricing.
      placeholder: "$119"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Anything else that changes the comparison?
      description: Optional. Floor, access, promotion, fees, or timing of the latest increase. Do not include private account details.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include personal contact, account, payment, gate-code, or other private information.
          required: true
