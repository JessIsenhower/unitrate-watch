<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Your scan status | UnitRate Watch</title><style>body{max-width:760px;margin:60px auto;padding:0 22px;font:16px/1.65 system-ui;color:#18201d;background:#f6f5ef}a{color:#175f49}.card{background:#fffdf8;border:1px solid #d9ddd7;border-radius:16px;padding:24px}h1{line-height:1.05}.muted{color:#667069;white-space:pre-wrap}</style></head><body><a href="/">← UnitRate Watch</a><h1>Your private scan status</h1><div class="card"><strong id="state">Loading…</strong><p id="result" class="muted">Keep this link. It is the only thing you need to check your result.</p></div><script>const p=new URLSearchParams(location.search),token=p.get('token');const state=document.getElementById('state'),result=document.getElementById('result');if(!token){state.textContent='Invalid status link';result.textContent='Return to UnitRate Watch and submit a new scan request.'}else fetch('/api/status?token='+encodeURIComponent(token)).then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error||'Could not load status');state.textContent=j.status==='complete'?'Your scan is complete':j.status==='in_progress'?'Your scan is being researched':'Your request is in the queue';result.textContent=j.result||'No result is posted yet. Bookmark this private link and check back.'}).catch(e=>{state.textContent='Could not load this scan';result.textContent=e.message})</script></body></html>
